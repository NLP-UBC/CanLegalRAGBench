# Experiment: IterRetGen with Gemini Embedding 2 + recursive 4096-char chunks + 1000 docs
# Shares index with gemini2_recursive_4096 (same embedder + chunker + dataset).
base_config: ../../configs/base.yaml

experiment_id: gemini2_recursive_4096_iterretgen_1k-docs
description: "IterRetGen: Gemini Embedding 2, recursive 4096-char chunks, 1000-doc corpus, 3 retrieval iterations"

dataset:
  max_docs: 1000

chunker:
  type: chunkers.recursive.RecursiveChunker
  max_chunk_chars: 4096
  overlap_chars: 256

embedder:
  type: embedders.gemini.GeminiEmbedder
  model_name: gemini-embedding-2
  task_type: RETRIEVAL_DOCUMENT
  batch_size: 50
  max_cost_usd: 10.0

generator:
  type: generators.gemini.GeminiGenerator
  model_name: gemini-2.5-flash
  max_output_tokens: 1024

iterretgen:
  max_iterations: 3
  short_answer: false
  intermediate_model_name: gemini-2.5-flash
  intermediate_max_output_tokens: 1024

evaluation:
  queries_path: data/queries.json
  k_values: [3, 5, 10, 25, 50]
  metrics:
    - recall_at_k
    - doc_recall_at_k
    - precision_at_k
    - hit_at_k
    - mrr
    - ndcg_at_k

indexing:
  document_batch_size: 10
  embedding_batch_size: 50
  save_intermediate_every: 50

logging:
  level: DEBUG
